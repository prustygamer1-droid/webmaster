<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Samurai Scrappy</title>
  <defs>
    <linearGradient id="ss-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset=".6" stop-color="#7a1f4f"/>
      <stop offset="1" stop-color="#e0604a"/>
    </linearGradient>
    <linearGradient id="ss-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".5" stop-color="#f5b81c"/>
      <stop offset="1" stop-color="#a86a00"/>
    </linearGradient>
    <linearGradient id="ss-lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3360"/>
      <stop offset="1" stop-color="#14102a"/>
    </linearGradient>
    <linearGradient id="ss-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dbe8"/>
    </linearGradient>
    <filter id="ss-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="ss-petal" d="M0 -10 C 7 -10 10 -2 6 6 L0 3 L-6 6 C -10 -2 -7 -10 0 -10 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#ss-sky)"/>
  <circle cx="256" cy="230" r="196" fill="#ffe3c4" opacity=".16"/>
  <circle cx="256" cy="230" r="150" fill="#ffd9b0" opacity=".22"/>
  <g fill="#ffc1d6">
    <use href="#ss-petal" transform="translate(56 92) rotate(30) scale(1.4)"/>
    <use href="#ss-petal" transform="translate(462 150) rotate(-40) scale(1.2)"/>
    <use href="#ss-petal" transform="translate(440 64) rotate(110)"/>
    <use href="#ss-petal" transform="translate(70 330) rotate(-70) scale(1.1)"/>
    <use href="#ss-petal" transform="translate(30 200) rotate(160) scale(.9)"/>
    <use href="#ss-petal" transform="translate(478 300) rotate(70) scale(1.3)"/>
  </g>


  <!-- armoured shoulders -->
  <path d="M66 520 C 76 436 156 404 256 404 C 356 404 436 436 446 520 Z" fill="url(#ss-lacquer)" stroke="#0b0818" stroke-width="6"/>
  <g fill="#b3202f" stroke="#0b0818" stroke-width="4">
    <path d="M70 450 L150 430 L156 470 L74 494 Z"/><path d="M76 500 L158 478 L162 512 L80 520 Z"/>
    <path d="M442 450 L362 430 L356 470 L438 494 Z"/><path d="M436 500 L354 478 L350 512 L432 520 Z"/>
  </g>
  <g stroke="#f5b81c" stroke-width="2"><path d="M86 458 L146 442 M90 480 L150 462 M426 458 L366 442 M422 480 L362 462"/></g>
  <path d="M200 420 L256 470 L312 420" fill="none" stroke="url(#ss-gold)" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="256" cy="470" r="12" fill="#67e8f9" filter="url(#ss-neon)"/>

  <!-- katana hilt over the shoulder -->
  <g transform="translate(392 392) rotate(-52)">
    <rect x="0" y="-9" width="150" height="18" rx="5" fill="#1a1a1f" stroke="#0b0818" stroke-width="3"/>
    <g stroke="#c9a227" stroke-width="3"><path d="M14 -9 l12 18 M34 -9 l12 18 M54 -9 l12 18 M74 -9 l12 18 M94 -9 l12 18 M114 -9 l12 18"/></g>
    <rect x="-8" y="-20" width="12" height="40" rx="4" fill="url(#ss-gold)" stroke="#7a4d00" stroke-width="3"/>
    <rect x="146" y="-11" width="12" height="22" rx="4" fill="url(#ss-gold)"/>
  </g>
  <!-- helmet side flaps (shikoro) -->
  <g fill="url(#ss-lacquer)" stroke="#0b0818" stroke-width="5">
    <path d="M118 200 L76 248 L82 330 L132 300 Z"/>
    <path d="M394 200 L436 248 L430 330 L380 300 Z"/>
  </g>
  <g stroke="#e0404f" stroke-width="4"><path d="M84 262 L126 236 M84 286 L128 262 M86 310 L130 286 M428 262 L386 236 M428 286 L384 262 M426 310 L382 286"/></g>

  <!-- head -->
  <rect x="122" y="160" width="268" height="214" rx="60" fill="url(#ss-white)" stroke="#0b0818" stroke-width="8"/>
  <rect x="154" y="214" width="204" height="130" rx="36" fill="#0a0a12" stroke="#0b0818" stroke-width="5"/>
  <path d="M170 228 Q256 216 342 228" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="9" stroke-linecap="round"/>
  <!-- determined eyes -->
  <g fill="none" stroke="#67e8f9" stroke-linecap="round" filter="url(#ss-neon)">
    <path d="M184 252 L236 266" stroke-width="9"/>
    <path d="M328 252 L276 266" stroke-width="9"/>
    <path d="M190 286 Q212 266 236 282" stroke-width="12"/>
    <path d="M322 286 Q300 266 276 282" stroke-width="12"/>
  </g>

  <!-- kabuto helmet -->
  <path d="M112 206 Q112 96 256 90 Q400 96 400 206 Z" fill="url(#ss-lacquer)" stroke="#0b0818" stroke-width="7"/>
  <g stroke="#c9a227" stroke-width="3" opacity=".8" fill="none">
    <path d="M160 200 Q170 130 214 102"/><path d="M208 202 Q214 128 240 94"/><path d="M256 204 L256 92"/>
    <path d="M304 202 Q298 128 272 94"/><path d="M352 200 Q342 130 298 102"/>
  </g>
  <path d="M98 200 Q256 168 414 200 L414 218 Q256 188 98 218 Z" fill="#2a2348" stroke="url(#ss-gold)" stroke-width="4"/>
  <!-- golden crescent crest -->
  <path d="M136 54 Q256 168 376 54 Q256 132 136 54 Z" fill="url(#ss-gold)" stroke="#7a4d00" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="256" cy="150" r="18" fill="url(#ss-gold)" stroke="#7a4d00" stroke-width="4"/>
  <circle cx="256" cy="150" r="7" fill="#b3202f"/>
</svg>
