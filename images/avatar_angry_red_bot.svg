<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Angry Red Bot</title>
  <defs>
    <radialGradient id="arb-bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset=".5" stop-color="#c3141c"/>
      <stop offset="1" stop-color="#3b0306"/>
    </radialGradient>
    <linearGradient id="arb-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a68"/>
      <stop offset=".45" stop-color="#e3221f"/>
      <stop offset="1" stop-color="#8c0a10"/>
    </linearGradient>
    <linearGradient id="arb-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0b0d"/>
      <stop offset="1" stop-color="#070203"/>
    </linearGradient>
    <radialGradient id="arb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd23f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="arb-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="arb-ray" d="M0 0 L-22 -380 L22 -380 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#arb-bg)"/>
  <!-- rage burst -->
  <g transform="translate(256 250)" fill="#ffb199" opacity=".22">
    <use xlink:href="#arb-ray"/><use xlink:href="#arb-ray" transform="rotate(30)"/><use xlink:href="#arb-ray" transform="rotate(60)"/>
    <use xlink:href="#arb-ray" transform="rotate(90)"/><use xlink:href="#arb-ray" transform="rotate(120)"/><use xlink:href="#arb-ray" transform="rotate(150)"/>
    <use xlink:href="#arb-ray" transform="rotate(180)"/><use xlink:href="#arb-ray" transform="rotate(210)"/><use xlink:href="#arb-ray" transform="rotate(240)"/>
    <use xlink:href="#arb-ray" transform="rotate(270)"/><use xlink:href="#arb-ray" transform="rotate(300)"/><use xlink:href="#arb-ray" transform="rotate(330)"/>
  </g>

  <!-- steam puffs -->
  <g fill="#fff" opacity=".85">
    <circle cx="58" cy="176" r="22"/><circle cx="80" cy="152" r="26"/><circle cx="44" cy="140" r="18"/><circle cx="66" cy="118" r="14"/>
    <circle cx="454" cy="176" r="22"/><circle cx="432" cy="152" r="26"/><circle cx="468" cy="140" r="18"/><circle cx="446" cy="118" r="14"/>
  </g>

  <!-- shoulders -->
  <path d="M74 520 C 86 430 160 396 256 396 C 352 396 426 430 438 520 Z" fill="url(#arb-shell)" stroke="#2a0406" stroke-width="7"/>
  <path d="M140 430 C 180 412 220 408 256 408" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
  <rect x="216" y="348" width="80" height="58" rx="14" fill="#3a0a0c" stroke="#2a0406" stroke-width="6"/>
  <rect x="222" y="444" width="68" height="26" rx="11" fill="#ffb020" filter="url(#arb-neon)"/>

  <!-- ears -->
  <circle cx="104" cy="250" r="36" fill="#8c0a10" stroke="#2a0406" stroke-width="7"/>
  <circle cx="104" cy="250" r="18" fill="#ffb020" filter="url(#arb-neon)"/>
  <circle cx="408" cy="250" r="36" fill="#8c0a10" stroke="#2a0406" stroke-width="7"/>
  <circle cx="408" cy="250" r="18" fill="#ffb020" filter="url(#arb-neon)"/>

  <!-- antenna -->
  <line x1="256" y1="122" x2="256" y2="70" stroke="#2a0406" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="62" r="34" fill="url(#arb-glow)"/>
  <circle cx="256" cy="62" r="16" fill="#ffd23f" stroke="#2a0406" stroke-width="5"/>

  <!-- head -->
  <rect x="104" y="116" width="304" height="254" rx="92" fill="url(#arb-shell)" stroke="#2a0406" stroke-width="8"/>
  <ellipse cx="190" cy="148" rx="62" ry="15" fill="#fff" opacity=".4" transform="rotate(-10 190 148)"/>

  <!-- visor -->
  <rect x="144" y="166" width="224" height="164" rx="48" fill="url(#arb-visor)" stroke="#2a0406" stroke-width="5"/>
  <path d="M170 182 Q256 170 342 182" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="10" stroke-linecap="round"/>

  <!-- furious face -->
  <g fill="#ffd23f" stroke="#ffd23f" filter="url(#arb-neon)">
    <line x1="170" y1="208" x2="240" y2="240" stroke-width="13" stroke-linecap="round"/>
    <line x1="342" y1="208" x2="272" y2="240" stroke-width="13" stroke-linecap="round"/>
    <path d="M182 234 L236 256 L232 270 Q206 280 186 262 Z" stroke="none"/>
    <path d="M330 234 L276 256 L280 270 Q306 280 326 262 Z" stroke="none"/>
    <rect x="204" y="286" width="104" height="30" rx="8" stroke="none"/>
  </g>
  <g stroke="#070203" stroke-width="4.5">
    <line x1="225" y1="286" x2="225" y2="316"/><line x1="246" y1="286" x2="246" y2="316"/>
    <line x1="266" y1="286" x2="266" y2="316"/><line x1="287" y1="286" x2="287" y2="316"/>
    <line x1="204" y1="301" x2="308" y2="301"/>
  </g>

  <!-- anger mark -->
  <g transform="translate(398 96) rotate(12)" fill="none" stroke-linecap="round">
    <g stroke="#fff" stroke-width="18">
      <path d="M-30 -8 Q-10 -10 -8 -30"/><path d="M8 -30 Q10 -10 30 -8"/>
      <path d="M30 8 Q10 10 8 30"/><path d="M-8 30 Q-10 10 -30 8"/>
    </g>
    <g stroke="#ff2d3a" stroke-width="9">
      <path d="M-30 -8 Q-10 -10 -8 -30"/><path d="M8 -30 Q10 -10 30 -8"/>
      <path d="M30 8 Q10 10 8 30"/><path d="M-8 30 Q-10 10 -30 8"/>
    </g>
  </g>
</svg>
