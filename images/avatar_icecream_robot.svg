<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ice Cream Yellow Robot</title>
  <defs>
    <radialGradient id="icr-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff07a"/>
      <stop offset=".55" stop-color="#ffcb12"/>
      <stop offset="1" stop-color="#f29a00"/>
    </radialGradient>
    <linearGradient id="icr-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#eeebf3"/>
      <stop offset="1" stop-color="#cfc9d8"/>
    </linearGradient>
    <linearGradient id="icr-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset=".5" stop-color="#ffc61a"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <linearGradient id="icr-cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a95a"/>
      <stop offset=".5" stop-color="#f6c47c"/>
      <stop offset="1" stop-color="#c98238"/>
    </linearGradient>
    <linearGradient id="icr-scoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#ff7fb0"/>
    </linearGradient>
    <clipPath id="icr-cone-clip"><path d="M194 110 L318 110 L256 6 Z"/></clipPath>
    <filter id="icr-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#icr-bg)"/>
  <g fill="#fff" opacity=".8">
    <path d="M60 90 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M450 70 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M452 380 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M48 370 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- shoulders -->
  <path d="M60 520 C 70 438 150 404 256 404 C 362 404 442 438 452 520 Z" fill="url(#icr-white)" stroke="#8a5a00" stroke-width="5"/>
  <circle cx="104" cy="474" r="46" fill="url(#icr-gold)" stroke="#8a5a00" stroke-width="5"/>
  <circle cx="408" cy="474" r="46" fill="url(#icr-gold)" stroke="#8a5a00" stroke-width="5"/>
  <rect x="212" y="452" width="88" height="44" rx="14" fill="#ffd83a" stroke="#8a5a00" stroke-width="4" filter="url(#icr-neon)"/>
  <rect x="230" y="466" width="52" height="8" rx="4" fill="#fff8c4"/>
  <rect x="204" y="370" width="104" height="44" rx="14" fill="#2a2a2e" stroke="#8a5a00" stroke-width="4"/>
  <rect x="234" y="378" width="44" height="26" rx="6" fill="#ffd83a" filter="url(#icr-neon)"/>

  <!-- crystal ears -->
  <g stroke="#b97800" stroke-width="3" stroke-linejoin="round">
    <polygon points="70,196 100,272 70,348 40,272" fill="url(#icr-gold)"/>
    <polygon points="442,196 472,272 442,348 412,272" fill="url(#icr-gold)"/>
  </g>
  <polyline points="70,196 70,348" stroke="#fff6b0" stroke-width="2" opacity=".7"/>
  <polyline points="442,196 442,348" stroke="#fff6b0" stroke-width="2" opacity=".7"/>
  <circle cx="98" cy="272" r="30" fill="#ffcc22" stroke="#8a5a00" stroke-width="5"/>
  <circle cx="414" cy="272" r="30" fill="#ffcc22" stroke="#8a5a00" stroke-width="5"/>
  <ellipse cx="70" cy="278" rx="54" ry="12" fill="none" stroke="#fffbd6" stroke-width="4" transform="rotate(-12 70 278)" filter="url(#icr-neon)"/>
  <ellipse cx="442" cy="278" rx="54" ry="12" fill="none" stroke="#fffbd6" stroke-width="4" transform="rotate(12 442 278)" filter="url(#icr-neon)"/>

  <!-- head -->
  <rect x="96" y="150" width="320" height="240" rx="104" fill="url(#icr-white)" stroke="#8a5a00" stroke-width="5"/>
  <!-- visor -->
  <rect x="134" y="200" width="244" height="166" rx="52" fill="#0d0b09" stroke="#3b2a00" stroke-width="4"/>
  <path d="M150 216 Q256 202 362 216" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
  <g fill="none" stroke="#ffd93a" stroke-width="5" stroke-linecap="round">
    <path d="M162 236 v-14 h14"/><path d="M350 236 v-14 h-14"/>
    <path d="M162 330 v14 h14"/><path d="M350 330 v14 h-14"/>
  </g>
  <!-- happy face -->
  <g filter="url(#icr-neon)">
    <path d="M184 254 L228 276 L184 298" fill="none" stroke="#ffe14d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M328 254 L284 276 L328 298" fill="none" stroke="#ffe14d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M236 306 L276 306 Q276 340 256 342 Q236 340 236 306 Z" fill="#ffe14d"/>
  </g>
  <ellipse cx="160" cy="320" rx="14" ry="7" fill="#ff8fb8" opacity=".85"/>
  <ellipse cx="352" cy="320" rx="14" ry="7" fill="#ff8fb8" opacity=".85"/>

  <!-- strawberry scoop squished on his head -->
  <path d="M142 172 C142 118 194 90 256 90 C318 90 370 118 370 172
           Q370 182 360 182 Q352 182 350 190 L350 204 Q345 216 340 204 L340 188 Q336 182 326 182
           L314 182 Q304 182 304 192 L304 216 Q296 232 288 216 L288 192 Q286 184 276 184
           L252 184 Q242 184 242 194 L242 226 Q234 242 226 226 L226 192 Q224 184 214 184
           L198 184 Q188 184 188 194 L188 210 Q181 222 174 210 L174 190 Q172 182 160 182
           Q142 182 142 172 Z" fill="url(#icr-scoop)" stroke="#c2477a" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="124" rx="30" ry="12" fill="#fff" opacity=".55" transform="rotate(-18 200 124)"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="150" x2="180" y2="144" stroke="#4fc3f7"/>
    <line x1="230" y1="160" x2="240" y2="166" stroke="#fff176"/>
    <line x1="300" y1="150" x2="310" y2="142" stroke="#81c784"/>
    <line x1="340" y1="166" x2="348" y2="172" stroke="#4fc3f7"/>
    <line x1="270" y1="166" x2="280" y2="160" stroke="#ba68c8"/>
    <line x1="200" y1="170" x2="208" y2="176" stroke="#ff8a65"/>
    <line x1="326" y1="128" x2="334" y2="134" stroke="#fff176"/>
  </g>

  <!-- upside-down waffle cone -->
  <g transform="rotate(7 256 104)">
    <path d="M194 110 L318 110 L256 6 Z" fill="url(#icr-cone)"/>
    <g clip-path="url(#icr-cone-clip)" stroke="#a5651f" stroke-width="3" opacity=".7">
      <line x1="160" y1="120" x2="280" y2="0"/><line x1="190" y1="120" x2="310" y2="0"/>
      <line x1="220" y1="120" x2="340" y2="0"/><line x1="250" y1="120" x2="370" y2="0"/>
      <line x1="130" y1="120" x2="250" y2="0"/>
      <line x1="350" y1="120" x2="230" y2="0"/><line x1="320" y1="120" x2="200" y2="0"/>
      <line x1="290" y1="120" x2="170" y2="0"/><line x1="260" y1="120" x2="140" y2="0"/>
      <line x1="380" y1="120" x2="260" y2="0"/>
    </g>
    <path d="M194 110 L318 110 L256 6 Z" fill="none" stroke="#8a5216" stroke-width="5" stroke-linejoin="round"/>
    <rect x="184" y="98" width="144" height="22" rx="11" fill="#d58f3e" stroke="#8a5216" stroke-width="5"/>
    <path d="M232 40 L244 24" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
