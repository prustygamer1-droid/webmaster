<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Neon DJ Bot</title>
  <defs>
    <linearGradient id="dj-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a5c"/>
      <stop offset=".55" stop-color="#7b1fa2"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <linearGradient id="dj-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6cde8"/>
    </linearGradient>
    <linearGradient id="dj-cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ec7"/>
      <stop offset="1" stop-color="#b0127a"/>
    </linearGradient>
    <linearGradient id="dj-eq" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="1" stop-color="#ff6ec7"/>
    </linearGradient>
    <filter id="dj-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#dj-bg)"/>
  <!-- background equaliser -->
  <g fill="#22e4ff" opacity=".18">
    <rect x="8" y="300" width="26" height="212"/><rect x="40" y="250" width="26" height="262"/><rect x="72" y="330" width="26" height="182"/>
    <rect x="414" y="280" width="26" height="232"/><rect x="446" y="220" width="26" height="292"/><rect x="478" y="320" width="26" height="192"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round">
    <path d="M60 110 v-48 l26 -8 v48"/><circle cx="52" cy="112" r="9" fill="#fff"/><circle cx="78" cy="104" r="9" fill="#fff"/>
    <path d="M450 150 v-46"/><path d="M450 104 q14 4 18 18"/><circle cx="442" cy="152" r="9" fill="#fff"/>
  </g>

  <!-- body -->
  <path d="M74 520 C 84 434 160 402 256 402 C 352 402 428 434 438 520 Z" fill="url(#dj-shell)" stroke="#1c0638" stroke-width="6"/>
  <rect x="196" y="440" width="120" height="50" rx="12" fill="#1c0638"/>
  <g fill="url(#dj-eq)" filter="url(#dj-neon)">
    <rect x="208" y="464" width="12" height="18" rx="3"/><rect x="226" y="452" width="12" height="30" rx="3"/>
    <rect x="244" y="458" width="12" height="24" rx="3"/><rect x="262" y="448" width="12" height="34" rx="3"/>
    <rect x="280" y="460" width="12" height="22" rx="3"/><rect x="298" y="454" width="12" height="28" rx="3"/>
  </g>
  <rect x="216" y="366" width="80" height="46" rx="14" fill="#1c0638"/>

  <!-- head -->
  <rect x="112" y="140" width="288" height="236" rx="84" fill="url(#dj-shell)" stroke="#1c0638" stroke-width="7"/>
  <ellipse cx="196" cy="168" rx="56" ry="12" fill="#fff" opacity=".8" transform="rotate(-8 196 168)"/>
  <rect x="148" y="190" width="216" height="154" rx="44" fill="#0c0420" stroke="#1c0638" stroke-width="5"/>
  <!-- happy eyes and an equaliser smile -->
  <g fill="none" stroke="#ff6ec7" stroke-width="13" stroke-linecap="round" filter="url(#dj-neon)">
    <path d="M186 254 Q208 224 230 254"/><path d="M282 254 Q304 224 326 254"/>
  </g>
  <g fill="url(#dj-eq)" filter="url(#dj-neon)">
    <rect x="212" y="296" width="10" height="14" rx="3"/><rect x="228" y="286" width="10" height="24" rx="3"/>
    <rect x="244" y="280" width="10" height="30" rx="3"/><rect x="260" y="284" width="10" height="26" rx="3"/>
    <rect x="276" y="290" width="10" height="20" rx="3"/><rect x="292" y="298" width="10" height="12" rx="3"/>
  </g>

  <!-- headphones -->
  <path d="M96 236 Q96 70 256 64 Q416 70 416 236" fill="none" stroke="#1c0638" stroke-width="30" stroke-linecap="round"/>
  <path d="M96 236 Q96 70 256 64 Q416 70 416 236" fill="none" stroke="#ff6ec7" stroke-width="16" stroke-linecap="round"/>
  <path d="M150 110 Q200 82 256 80" fill="none" stroke="#ffd1ec" stroke-width="5" stroke-linecap="round"/>
  <rect x="62" y="196" width="72" height="124" rx="30" fill="url(#dj-cup)" stroke="#1c0638" stroke-width="7"/>
  <rect x="378" y="196" width="72" height="124" rx="30" fill="url(#dj-cup)" stroke="#1c0638" stroke-width="7"/>
  <circle cx="98" cy="258" r="20" fill="none" stroke="#22e4ff" stroke-width="6" filter="url(#dj-neon)"/>
  <circle cx="414" cy="258" r="20" fill="none" stroke="#22e4ff" stroke-width="6" filter="url(#dj-neon)"/>
</svg>
